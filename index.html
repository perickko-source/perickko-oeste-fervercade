<style>

window.addEventListener('error', function(e){

<script>

// ---------- LOS 12 FORAJIDOS ----------
const ARCHIVOS = ['chocobo.png','danifm.png','daniju.png','eljefe.png','gunner.png','lajefa.png',
  'mario.png','minato.png','perickko.png','pixelmaster.png','toni.png','wuantiles.png'];
const NOMBRES = ['Chocobo','Danifm','Daniju','El Jefe','Gunner','La Jefa',
  'Mario','Minato','Perickko','Pixelmaster','Toni','Wuantiles'];
const RATIO_IMG = 842/1264;
const EMOJIS_RESERVA = ['🐔','','🕵️','','','😎','','','','','',''];
const PENALIZACION = 10;

const personajes = [];
let listos = 0;
function procesar(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height);
  const px = d.data;
  for(let i=0; i<px.length; i+=4){
    if(px[i]>235 && px[i+1]>235 && px[i+2]>235) px[i+3] = 0;
  }
  x.putImageData(d, 0, 0);
  return c;
}
for(let i=0; i<ARCHIVOS.length; i++){
  const p = { sprite:null, ratio:RATIO_IMG, nombre:NOMBRES[i] };
  personajes.push(p);
  const img = new Image();
  img.onload = () => {
    p.ratio = img.naturalWidth / img.naturalHeight;
    try { p.sprite = procesar(img); }
    catch(e){ p.sprite = img; }
    finCarga();
  };
  img.onerror = finCarga;
  img.src = ARCHIVOS[i];
}

// ---------- TRÁFICO DEL OESTE: 2 DELOREANS + 1 JINETE ANIMADO ----------
let cocheSprite = null, cocheRatio = 768/432;
{
  const img = new Image();
  img.onload = () => {
    cocheRatio = img.naturalWidth / img.naturalHeight;
    try { cocheSprite = procesar(img); } catch(e){ cocheSprite = img; }

    document.getElementById('estadoCarga').innerHTML =

      (n<ARCHIVOS.length ? ' (los que faltan saldrán con emoji)' : '');

      if(p.sprite){

        gal.appendChild(im);

// ---------- ESTADO ----------
let activos = [], efectos = [], agujeros = [];

function easeOut(t){ return 1 - Math.pow(1-t, 3); }

  try{
    if(typeof spawnRect === 'function' && SPAWNS[i]) return spawnRect(i);

function datosPistola(){

  return { S, gx:cj.width/2, gy:cj.height + 15*S };
}

  const {S,gx,gy} = datosPistola();
  const ang = Math.atan2(y-gy, x-gx);
  return { ang, bx:gx + Math.cos(ang)*80*S, by:gy + Math.sin(ang)*80*S };
}

let audioCtx = null;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
const RUTAS_SONIDO = {
  disparo:'disparo.ogg', disparo2:'disparo2.ogg', recarga:'recarga.ogg', ouch:'ouch.ogg',
  lajefa:'lajefa.ogg', perickko:'perickko.ogg', chocobo:'chocobo.ogg',
  disparoPixel:'disparo-pixelmaster.ogg', delorian:'delorian.ogg',
  trote:'trotedecaballo.ogg'
};
const SONIDOS_ESPECIALES = { 'lajefa.png':'lajefa', 'perickko.png':'perickko', 'chocobo.png':'chocobo' };
const SONIDOS_DISPARO_ESPECIALES = { 'pixelmaster.png':'disparoPixel' };
for(const k in RUTAS_SONIDO){ const a = new Audio(RUTAS_SONIDO[k]); a.preload='auto'; }
function reproducir(k, volumen=1, rate=1){
  const c = new Audio(RUTAS_SONIDO[k]);
  c.volume = volumen; c.playbackRate = rate;
  c.play().catch(()=>{});
  return c;
}
function sonidoSeco(f){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), gg=audioCtx.createGain();
  o.type='square'; o.frequency.value=f;
  gg.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gg.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.08);
  o.connect(gg).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.09);
}

// ---------- SPAWN ----------
function aparecerPersonaje(){
  if(typeof SPAWNS === 'undefined' || !SPAWNS.length) return;
  const usadosS = new Set(activos.map(a=>a.idx));
  const libresS = SPAWNS.map((s,i)=>i).filter(i=>!usadosS.has(i));
  if(!libresS.length) return;
  const idx = libresS[Math.floor(Math.random()*libresS.length)];
  const usadosP = new Set(activos.map(a=>a.pers));
  const libresP = personajes.map((p,i)=>i).filter(i=>!usadosP.has(i));
  if(!libresP.length) return;
  const pers = libresP[Math.floor(Math.random()*libresP.length)];
  activos.push({ idx, pers, x:0, y:0, w:0, h:0, r:null, fx:0, fy:0,

    tiempoVisible: 1.0 + Math.random()*1.2,

  reproducir(SONIDOS_DISPARO_ESPECIALES[ARCHIVOS[a.pers]] || 'disparo2');
  dispararon[a.pers]++;
  if(PENALIZACION > 0){
    score = Math.max(0, score - PENALIZACION);
    efectos.push({tipo:'acertado', x:gx, y:gy-80, vida:0.8, texto:'-'+PENALIZACION+' ¡te han dado!', color:'#ff6a5a'});
    dano = 1; shake = 1;
  }

// ---------- TRÁFICO: lógica + CÁMARA LENTA (deloreans) + SONIDOS ----------
function spriteDe(st){
  if(st.tipo==='coche1')  return [cocheSprite,  cocheRatio,  200, 647];

function actualizarCoches(dt){
  if(typeof IW === 'undefined') return;
  const s = Math.max(cv.width/IW, cv.height/IH);
  const ox = (cv.width-IW*s)/2, oy = (cv.height-IH*s)/2;
  for(const st of coches){
    const [sprite, ratio, hInt, velBase] = spriteDe(st);
    if(st.tipo!=='caballo' && !sprite) continue;
    const esDelorean = (st.tipo !== 'caballo');
    if(!st.c){
      if(jugando){
        st.timer -= dt;
        if(st.timer<=0){
          let vel = velBase;
          if(!esDelorean){
            const dur = 5 + Math.random()*1.5; // jinete: mínimo 5 s en pantalla
            vel = (IW + hInt*ratio + 120) / dur;
          }
          st.c = { xInt: st.dir>0 ? -hInt*ratio-60 : IW+60,
                   wInt: hInt*ratio, hInt, vel, tShot: 0.6,
                   w:0, h:0, x:0, y:0, snd:null,
                   willSlow: esDelorean && Math.random()<0.5,
                   slowP: 0.3 + Math.random()*0.3,
                   slowUsed:false, slowActive:false, slowT:0, slowDur:0 };
          st.c.snd = reproducir(esDelorean ? 'delorian' : 'trote');
        }
      }
    } else {
      const c = st.c;
      if(c.willSlow && !c.slowUsed){
        const cx = c.xInt + c.wInt/2;
        const p = st.dir>0 ? cx/IW : 1 - cx/IW;
        if(p >= c.slowP){
          c.slowUsed = true; c.slowActive = true;
          c.slowT = 0; c.slowDur = 1.0 + Math.random()*0.5;
          if(c.snd && !c.snd.ended){ c.snd.playbackRate = 0.5; }
          else { c.snd = reproducir('delorian', 1, 0.5); }
        }
      }
      if(c.slowActive){
        c.slowT += dt;
        if(c.slowT >= c.slowDur){
          c.slowActive = false;
          if(c.snd && !c.snd.ended) c.snd.playbackRate = 1;
        }
      }
      const multVel = c.slowActive ? 0.22 : 1;
      c.xInt += st.dir * c.vel * multVel * dt;
      c.w = c.wInt*s; c.h = c.hInt*s;
      c.x = ox + (c.xInt + c.wInt/2)*s;
      c.y = oy + 700*s - c.h/2;
      if(jugando && c.xInt > -c.wInt*0.2 && c.xInt < IW){
        c.tShot -= dt * (c.slowActive ? 0.35 : 1);
        if(c.tShot<=0){
          c.tShot = 0.9 + Math.random()*0.7;
          const fxp = c.x + st.dir*c.w*0.02, fyp = c.y + c.h*0.42;
          const {gx,gy} = datosPistola();
          efectos.push({tipo:'flashEnemigo', x:fxp, y:fyp, vida:0.15});
          efectos.push({tipo:'balaEnemiga', x0:fxp, y0:fyp, x1:gx, y1:gy-30, vida:0.12, total:0.12});
          if(c.slowActive) reproducir('disparo2', 0.9, 0.5);
          else reproducir('disparo2');
          if(PENALIZACION>0){
            score = Math.max(0, score - PENALIZACION);
            efectos.push({tipo:'acertado', x:gx, y:gy-80, vida:0.8, texto:'-'+PENALIZACION+' ¡te han dado!', color:'#ff6a5a'});
            dano = 1; shake = 1;
          }
        }
      }
      const fuera = st.dir>0 ? (c.xInt > IW + 80) : (c.xInt + c.wInt < -80);
      if(fuera){
        if(c.snd) c.snd.pause();
        st.c = null; st.timer = 8 + Math.random()*8;
      }
    }
    // el jinete animado vive en su propia capa DOM (z3)
    if(st.tipo==='caballo'){
      if(st.c){
        caballoImgEl.style.display='block';
        caballoImgEl.style.width = st.c.w+'px';
        caballoImgEl.style.height = st.c.h+'px';
        caballoImgEl.style.transform = 'translate('+(st.c.x-st.c.w/2)+'px,'+(st.c.y-st.c.h/2)+'px)';
      } else {
        caballoImgEl.style.display='none';
      }
    }
  }
}

// ---------- ACTUALIZAR ----------
function actualizar(dt){
  if(pausa) return;
  if(jugando){
    tiempo -= dt;
    if(tiempo<=0){ tiempo=0; jugando=false; }
    spawnTimer -= dt;
    if(spawnTimer<=0){ aparecerPersonaje(); spawnTimer = 0.5 + Math.random()*0.9; }
  }
  const ref = rectSpawn(5);
  for(let i=activos.length-1; i>=0; i--){
    const a = activos[i];
    const r = rectSpawn(a.idx);
    a.h = ref.h;
    a.w = ref.h * personajes[a.pers].ratio;
    a.x = r.x + r.w/2;
    a.r = r;
    a.fx = a.x;
    a.fy = r.y + r.h*0.45;
    const esPuerta = (a.idx === 5);
    const fy = esPuerta ? (r.y + r.h - a.h/2) : (r.y + r.h*0.06 + a.h/2);
    const sy = r.y + r.h + a.h/2;
    if(a.fase==='entrando'){
      a.progreso += dt*1.4;
      if(a.progreso>=1){ a.progreso=1; a.fase='visible'; }
      a.y = sy + (fy-sy)*easeOut(Math.min(a.progreso,1));
    } else if(a.fase==='visible'){
      a.y = fy;
      a.tiempoVisible -= dt;
      if(a.tiempoVisible<=0){ a.fase='disparando'; a.tDisparo=0; a.disparado=false; }
    } else if(a.fase==='disparando'){
      a.y = fy;
      a.tDisparo += dt;
      if(!a.disparado && a.tDisparo >= 0.15){ a.disparado = true; disparoEnemigo(a); }
      if(a.tDisparo >= 0.7){ a.fase='saliendo'; a.progreso=0; }
    } else {
      a.progreso += dt*1.4;
      if(a.progreso>=1){ activos.splice(i,1); continue; }
      a.y = fy + (sy-fy)*easeOut(Math.min(a.progreso,1));
    }
  }
  actualizarCoches(dt);
  for(let i=agujeros.length-1;i>=0;i--){ agujeros[i].vida-=dt; if(agujeros[i].vida<=0) agujeros.splice(i,1); }
  for(let i=efectos.length-1;i>=0;i--){ efectos[i].vida-=dt; if(efectos[i].vida<=0) efectos.splice(i,1); }
  flashBoca = Math.max(0, flashBoca - dt*8);
  dano = Math.max(0, dano - dt*2);
  shake = Math.max(0, shake - dt*3);
}

// ---------- DISPARO DEL JUGADOR ----------
function disparar(x,y){
  if(!jugando) return;
  if(balas<=0){ sonidoSeco(200); return; }
  balas--; flashBoca = 1;
  reproducir('disparo');
  const {bx,by} = bocaCanon(x,y);
  efectos.push({tipo:'bala', x0:bx, y0:by, x1:x, y1:y, vida:0.09, total:0.09});

  for(const st of coches){
    const c = st.c;
    if(c && x > c.x-c.w/2 && x < c.x+c.w/2 && y > c.y-c.h/2 && y < c.y+c.h/2){
      racha++;
      const mult = multPorRacha(racha);
      const pts = 50*mult;
      score += pts;
      reproducir('ouch');
      if(c.snd) c.snd.pause();
      efectos.push({tipo:'flashEnemigo', x:c.x, y:c.y+c.h*0.2, vida:0.2});
      efectos.push({tipo:'acertado', x:c.x, y:c.y-c.h*0.55, vida:0.9,
        texto:(st.tipo==='caballo' ? '🐎 ¡AL GALOPE! +' : '🚗 ¡COCHAZO! +')+pts+(mult>1?' (x'+mult+')':''),
        color:'#8affff'});
      st.c = null; st.timer = 8 + Math.random()*8;
      return;
    }
  }

  for(let i=activos.length-1;i>=0;i--){
    const a = activos[i];
    if(a.fase==='saliendo') continue;
    const r = a.r || rectSpawn(a.idx);
    const tocado = x > r.x-4 && x < r.x+r.w+4 && y > r.y-4 && y < r.y+r.h+4;
    if(tocado){
      const headshot = y < r.y + r.h*0.35;
      racha++;
      const mult = multPorRacha(racha);
      const pts = (headshot?20:10) * mult;
      score += pts;
      tiroteados[a.pers]++;
      reproducir(SONIDOS_ESPECIALES[ARCHIVOS[a.pers]] || 'ouch');
      efectos.push({tipo:'acertado', x:a.fx, y:r.y-6, vida:0.8,
        texto:(headshot?'¡HEADSHOT! ':'')+'+'+pts+(mult>1?' (x'+mult+')':''),
        color: headshot?'#ff9a4a':undefined});
      activos.splice(i,1);
      return;
    }
  }
  if(racha>=3) efectos.push({tipo:'texto', x, y:y+30, vida:0.7, texto:'💔 racha rota', color:'#bbb'});
  racha = 0;
  agujeros.push({x, y, vida:4});
  if(agujeros.length>40) agujeros.shift();
  efectos.push({tipo:'fallo', x, y, vida:0.4});
}
function recargar(){
  if(balas<6){ balas=6; reproducir('recarga');
    efectos.push({tipo:'texto', x:cj.width/2, y:cj.height-40, vida:0.8, texto:'¡Recargado!'}); }
}

// ---------- DIBUJO ----------
function dibujarAgujeros(){
  for(const a of agujeros){
    octx.globalAlpha = Math.min(1, a.vida);
    octx.fillStyle='#2b1a0f';
    octx.beginPath(); octx.arc(a.x,a.y,3.5,0,Math.PI*2); octx.fill();
    octx.strokeStyle='rgba(0,0,0,0.5)'; octx.lineWidth=2;
    octx.beginPath(); octx.arc(a.x,a.y,5.5,0,Math.PI*2); octx.stroke();
    octx.globalAlpha = 1;
  }
}
function dibujarPersonajes(){
  for(const a of activos){
    const r = a.r || rectSpawn(a.idx);
    octx.save();
    octx.beginPath();
    octx.rect(r.x-2, r.y-2, r.w+4, r.h+4);
    octx.clip();
    if(personajes[a.pers].sprite){
      octx.drawImage(personajes[a.pers].sprite, a.x-a.w/2, a.y-a.h/2, a.w, a.h);
    } else {
      octx.font = a.h + 'px serif';
      octx.textAlign='center'; octx.textBaseline='middle';
      octx.fillText(EMOJIS_RESERVA[a.pers], a.x, a.y);
    }
    octx.restore();
  }
}
function dibujarCoches(){
  for(const st of coches){
    const c = st.c; if(!c) continue;
    if(st.tipo==='caballo'){
      // la polvareda del jinete va en la capa de personajes (debajo de él)
      octx.fillStyle='rgba(170,130,80,0.30)';
      for(let i=0;i<3;i++){
        octx.beginPath();
        octx.arc(c.x - c.w*0.52 - i*12, c.y + c.h*0.44 - i*5, 7+i*5, 0, Math.PI*2);
        octx.fill();
      }
      continue;
    }
    const [sprite] = spriteDe(st);
    if(!sprite) continue;
    if(c.slowActive){
      const gr = octx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.w*0.75);
      gr.addColorStop(0,'rgba(150,220,255,0.30)');
      gr.addColorStop(1,'rgba(150,220,255,0)');
      octx.fillStyle=gr;
      octx.fillRect(c.x-c.w*0.75, c.y-c.w*0.75, c.w*1.5, c.w*1.5);
      octx.strokeStyle='rgba(180,230,255,0.45)';
      octx.lineWidth=2;
      for(let i=0;i<3;i++){
        const ly = c.y - c.h*0.15 + i*c.h*0.22;
        const back = c.x - st.dir*(c.w*0.55);
        octx.beginPath();
        octx.moveTo(back, ly);
        octx.lineTo(back - st.dir*c.w*0.5, ly);
        octx.stroke();
      }
    }
    octx.fillStyle='rgba(170,130,80,0.30)';
    for(let i=0;i<3;i++){
      octx.beginPath();
      octx.arc(c.x - st.dir*c.w*0.52 - st.dir*i*12, c.y + c.h*0.44 - i*5, 7+i*5, 0, Math.PI*2);
      octx.fill();
    }
    octx.drawImage(sprite, c.x-c.w/2, c.y-c.h/2, c.w, c.h);
  }
}
function estrella(x,y,R){
  O.beginPath();
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4;
    O.lineTo(x+Math.cos(a)*R, y+Math.sin(a)*R);
    const a2 = a + Math.PI/8;
    O.lineTo(x+Math.cos(a2)*R*0.4, y+Math.sin(a2)*R*0.4);
  }
  O.closePath();
}
function dibujarEfectos(){
  for(const e of efectos){
    if(e.tipo==='bala' || e.tipo==='balaEnemiga'){
      const t = 1 - e.vida/e.total;
      const px = e.x0+(e.x1-e.x0)*t, py = e.y0+(e.y1-e.y0)*t;
      const tt = Math.max(0, t-0.3);
      const tx = e.x0+(e.x1-e.x0)*tt, ty = e.y0+(e.y1-e.y0)*tt;
      O.strokeStyle = e.tipo==='bala' ? 'rgba(255,200,90,0.9)' : 'rgba(255,90,60,0.9)';
      O.lineWidth=3;
      O.beginPath(); O.moveTo(tx,ty); O.lineTo(px,py); O.stroke();
      O.fillStyle = e.tipo==='bala' ? '#ffe9a0' : '#ffb0a0';
      O.beginPath(); O.arc(px,py,4,0,Math.PI*2); O.fill();
    } else if(e.tipo==='flashEnemigo'){
      const f = e.vida/0.15;
      O.fillStyle = 'rgba(255,180,80,'+f+')';
      estrella(e.x, e.y, 30*f+6); O.fill();
      O.fillStyle = 'rgba(255,255,220,'+f+')';
      O.beginPath(); O.arc(e.x,e.y,(30*f+6)*0.35,0,Math.PI*2); O.fill();
    } else if(e.tipo==='fallo'){
      O.globalAlpha = Math.min(1, e.vida*2);
      O.strokeStyle='#ccc'; O.lineWidth=2;
      O.beginPath(); O.arc(e.x,e.y,10+(0.4-e.vida)*30,0,Math.PI*2); O.stroke();
      O.globalAlpha = 1;
    } else {
      O.globalAlpha = Math.min(1, e.vida*2);
      O.fillStyle = e.color || (e.tipo==='acertado' ? '#ffd97a' : '#8aff8a');
      O.font='bold 22px Georgia'; O.textAlign='center';
      O.fillText(e.texto, e.x, e.y - (0.7-e.vida)*50);
      O.globalAlpha = 1;
    }
  }
}
function dibujarPistola(){
  const {S,gx,gy} = datosPistola();
  const ang = Math.atan2(raton.y-gy, raton.x-gx);
  O.save(); O.translate(gx,gy); O.rotate(ang);
  O.save(); O.rotate(0.55);
  O.fillStyle = '#5a3a22'; O.fillRect(-10*S, 6*S, 20*S, 42*S);
  O.restore();
  O.fillStyle = '#2e2e36';
  O.fillRect(-6*S, -7*S, 84*S, 14*S);
  O.fillRect(16*S, -12*S, 26*S, 24*S);
  O.fillStyle = '#4a4a55';
  O.fillRect(42*S, -7*S, 36*S, 5*S);
  O.fillRect(74*S, -11*S, 4*S, 6*S);
  O.restore();
  if(flashBoca > 0.4){
    const f = (flashBoca-0.4)/0.6;
    const {bx,by} = bocaCanon(raton.x, raton.y);
    O.save(); O.translate(bx,by); O.rotate(ang);
    const R = 26*f*S + 8;
    O.fillStyle = 'rgba(255,220,120,'+f+')';
    estrella(0,0,R); O.fill();
    O.fillStyle = 'rgba(255,255,220,'+f+')';
    O.beginPath(); O.arc(0,0,R*0.35,0,Math.PI*2); O.fill();
    O.restore();
  }
}
function dibujarHUD(){
  O.fillStyle='rgba(0,0,0,0.5)'; O.fillRect(0,0,fx.width,36);
  O.fillStyle='#ffd97a'; O.font='bold 20px Georgia'; O.textBaseline='middle';
  O.textAlign='left';  O.fillText('⭐ Puntos: '+score, 15, 19);
  const mult = multPorRacha(racha);
  if(mult>1){ O.fillStyle='#ff9a4a'; O.fillText('🔥 x'+mult, 230, 19); }
  O.fillStyle='#ffd97a';
  O.textAlign='center'; O.fillText('⏱ '+Math.ceil(tiempo)+'s', fx.width/2, 19);
  O.textAlign='right';
  let m=''; for(let i=0;i<6;i++) m += i<balas ? '🔸' : '·';
  O.fillText(m, fx.width-15, 19);
}
function dibujarMira(){
  const {x,y} = raton;
  O.strokeStyle = '#fff'; O.lineWidth = 2;
  const r = 18;
  O.beginPath(); O.arc(x,y,r,0,Math.PI*2); O.stroke();
  O.beginPath();
  O.moveTo(x-r-8,y); O.lineTo(x-r+4,y); O.moveTo(x+r+8,y); O.lineTo(x+r-4,y);
  O.moveTo(x,y-r-8); O.lineTo(x,y-r+4); O.moveTo(x,y+r+8); O.lineTo(x,y+r-4);
  O.stroke();
}

function bucle(t){
  const dt = Math.min((t - tPrevio)/1000, 0.05);
  tPrevio = t;
  actualizar(dt);

  const shx = shake>0 ? (Math.random()-0.5)*10*shake : 0;
  const shy = shake>0 ? (Math.random()-0.5)*10*shake : 0;

  // capa 1 (z2): agujeros + personajes de ventanas/puerta + deloreans
  octx.clearRect(0,0,cj.width,cj.height);
  octx.save();
  octx.translate(shx, shy);
  dibujarAgujeros();
  dibujarPersonajes();
  dibujarCoches();
  octx.restore();
  // (el caballo animado vive en su <img> z3, entre ambas capas)

  // capa 2 (z4): efectos, revólver, daño, HUD y mira
  fctx.clearRect(0,0,fx.width,fx.height);
  fctx.save();
  fctx.translate(shx, shy);
  O = fctx;
  dibujarEfectos();
  dibujarPistola();
  fctx.restore();

  if(dano>0){ fctx.fillStyle='rgba(255,40,20,'+(0.28*dano)+')'; fctx.fillRect(0,0,fx.width,fx.height); }
  O = fctx;
  dibujarHUD();
  if(!esTouch) dibujarMira();
  if(!jugando && tiempo<=0){
    if(esTouch) btnRecarga.style.display = 'none';
    caballoImgEl.style.display = 'none';
    fctx.fillStyle='rgba(0,0,0,0.6)'; fctx.fillRect(0,0,fx.width,fx.height);
    fctx.fillStyle='#ffd97a'; fctx.textAlign='center';
    fctx.font='bold 42px Georgia'; fctx.fillText('🤠 ¡SE ACABÓ EL TIEMPO!', fx.width/2, fx.height/2-80);
    fctx.font='28px Georgia'; fctx.fillText('Puntuación final: '+score, fx.width/2, fx.height/2-35);
    const totalT = tiroteados.reduce((a,b)=>a+b,0);
    const totalD = dispararon.reduce((a,b)=>a+b,0);
    fctx.font='22px Georgia'; fctx.fillStyle='#e8c96a';
    if(totalT>0 || totalD>0){
      if(totalT>0){
        const iMaxT = tiroteados.indexOf(Math.max(...tiroteados));
        fctx.fillText('🎯 El más tiroteado: '+NOMBRES[iMaxT]+' ('+tiroteados[iMaxT]+' tiros)', fx.width/2, fx.height/2+5);
      }
      if(totalD>0){
        const iMaxD = dispararon.indexOf(Math.max(...dispararon));
        fctx.fillText('💥 El que más te disparó: '+NOMBRES[iMaxD]+' ('+dispararon[iMaxD]+')', fx.width/2, fx.height/2+40);
      }
    } else {
      fctx.fillText('Duelo sin incidentes 😅', fx.width/2, fx.height/2+15);
    }
    fctx.font='20px Georgia'; fctx.fillStyle='#fff';
    fctx.fillText('Toca para jugar otra vez', fx.width/2, fx.height/2+85);
  }
  requestAnimationFrame(bucle);
}

function empezar(){
  score=0; tiempo=60; balas=6; racha=0;
  activos=[]; efectos=[]; agujeros=[];
  coches[0].c=null; coches[0].timer=6;
  coches[1].c=null; coches[1].timer=14;
  coches[2].c=null; coches[2].timer=20;
  tiroteados = Array(ARCHIVOS.length).fill(0);
  dispararon = Array(ARCHIVOS.length).fill(0);
  spawnTimer=0.3; jugando=true;
  if(esTouch) btnRecarga.style.display = 'flex';
}
function arrancar(){
  if(!cargado) return;
  pantallaEl.style.display = 'none';
  avisoEl.style.display = 'none';
  initAudio();
  empezar();
}

cj.addEventListener('mousemove', e=>{ raton.x=e.clientX; raton.y=e.clientY; });
cj.addEventListener('mousedown', e=>{
  initAudio();
  if(!jugando && tiempo<=0){ empezar(); return; }
  disparar(e.clientX, e.clientY);
});
cj.addEventListener('touchstart', e=>{
  e.preventDefault(); initAudio();
  const t=e.touches[0]; raton.x=t.clientX; raton.y=t.clientY;
  if(!jugando && tiempo<=0){ empezar(); return; }
  disparar(t.clientX, t.clientY);
}, {passive:false});
addEventListener('keydown', e=>{
  if(e.key==='r'||e.key==='R'||e.key===' '){ e.preventDefault(); recargar(); }
});
btnRecarga.addEventListener('touchstart', e=>{
  e.preventDefault(); e.stopPropagation();
  initAudio();
  if(jugando) recargar();
}, {passive:false});
btnRecarga.addEventListener('click', e=>{ e.stopPropagation(); if(jugando) recargar(); });

btnPantalla.addEventListener('click', e=>{
  e.stopPropagation();
  pedirPantallaCompleta();
  pantallaEl.style.display = 'none';
  avisoEl.style.display = 'flex';
});
btnJugar.addEventListener('click', e=>{ e.stopPropagation(); arrancar(); });
avisoEl.addEventListener('click', ()=>{ arrancar(); });

actualizarOrientacion();
requestAnimationFrame(bucle);
})();
</script>
