<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🤠 Duelo en el Oeste — Yo soy Fevercade</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  #juego { display:block; width:100vw; height:100vh; cursor:none; touch-action:none; }
  #aviso { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.7); z-index:10; }
  #caja { color:#fff; font-family:Georgia,serif; font-size:20px; text-align:center;
    background:rgba(30,15,5,.92); padding:25px 40px; border:3px solid #c8892f; border-radius:12px;
    max-width:90vw; }
  #galeria { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  #galeria img { height:70px; border-radius:6px; border:2px solid #c8892f; background:#fff; }
  #caja button { margin-top:16px; padding:12px 36px; font-size:22px; font-family:Georgia,serif;
    background:#c8892f; border:none; border-radius:6px; cursor:pointer; color:#2b1a0a; }
  #caja button:hover:not(:disabled) { background:#e8a94f; }
  #btnPantalla { margin-top:16px; padding:16px 34px; font-size:22px; font-family:Georgia,serif;
    background:#c8892f; border:none; border-radius:8px; cursor:pointer; color:#2b1a0a; }
  .parpadea { animation: parp 1.1s ease-in-out infinite; }
  @keyframes parp { 0%,100%{opacity:1} 50%{opacity:0.35} }
  #gira { position:fixed; inset:0; background:#1a0f05; color:#fff; display:none;
    flex-direction:column; align-items:center; justify-content:center; z-index:20;
    font-family:Georgia,serif; text-align:center; font-size:24px; }
  #gira .fono { font-size:90px; animation: rotar 1.8s ease-in-out infinite; }
  @keyframes rotar { 0%,25% {transform:rotate(0deg);} 70%,100% {transform:rotate(90deg);} }
  #btnRecarga { position:fixed; right:16px; bottom:16px; width:76px; height:76px; border-radius:50%;
    background:rgba(200,137,47,0.9); border:3px solid #6b4a2a; color:#2b1a0a; font-size:32px;
    display:none; z-index:5; cursor:pointer; font-family:Georgia,serif;
    align-items:center; justify-content:center; touch-action:manipulation; }
  #btnRecarga:active { transform:scale(0.9); }
</style>
</head>
<body>
<canvas id="juego"></canvas>

<button id="btnRecarga" title="Recargar">🔄</button>

<div id="gira">
  <div class="fono">📱</div>
  <p>Gira el dispositivo para jugar</p>
  <p style="font-size:16px; margin-top:10px; color:#c8892f;">El oeste se vive en horizontal 🤠</p>
</div>

<div id="aviso"><div id="caja">
  <div style="font-size:34px;">🤠 DUELO EN EL OESTE 🤠</div>
  <div style="font-size:24px; margin-top:4px;">Yo soy Fevercade</div>
  <p id="estadoCarga" style="margin-top:10px;">Cargando forajidos…</p>
  <div id="galeria"></div>
  <button id="btnPantalla" class="parpadea" style="display:none;">📱 PULSA PARA PANTALLA COMPLETA</button>
  <p style="margin-top:10px;">Clic = disparar · R o ESPACIO = recargar (6 balas)<br>
  ⚠️ Si no los cazas a tiempo, ¡ellos te disparan a ti!<br>
  🔥 Encadena aciertos para multiplicar · 💥 HEADSHOT = doble</p>
  <button id="btnJugar" disabled style="opacity:.5">¡A JUGAR!</button>
</div></div>

<script>
(() => {
const canvas = document.getElementById('juego');
const ctx = canvas.getContext('2d');
const btnRecarga = document.getElementById('btnRecarga');
const btnPantalla = document.getElementById('btnPantalla');
const btnJugar = document.getElementById('btnJugar');
let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; calcularZonas(); }

// ---------- ORIENTACIÓN ----------
const esTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
let cargado = false, pausa = false;

function actualizarOrientacion(){
  const portrait = innerHeight > innerWidth;
  document.getElementById('gira').style.display = portrait ? 'flex' : 'none';
  pausa = portrait && jugando;
}
addEventListener('resize', () => { resize(); setTimeout(actualizarOrientacion, 60); });
addEventListener('orientationchange', () => setTimeout(actualizarOrientacion, 60));
const mqPortrait = matchMedia('(orientation: portrait)');
if(mqPortrait.addEventListener) mqPortrait.addEventListener('change', () => setTimeout(actualizarOrientacion, 60));

function pedirPantallaCompleta(){
  const el = document.documentElement;
  try{
    if(el.requestFullscreen){ el.requestFullscreen().catch(()=>{}); }
    else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
  }catch(e){}
  try{
    if(screen.orientation && screen.orientation.lock)
      screen.orientation.lock('landscape').catch(()=>{});
  }catch(e){}
}

// ---------- LOS 12 FORAJIDOS (misma carpeta que el index.html) ----------
const ARCHIVOS = ['chocobo.png','danifm.png','daniju.png','eljefe.png','gunner.png','lajefa.png',
  'mario.png','minato.png','perickko.png','pixelmaster.png','toni.png','wuantiles.png'];
const NOMBRES = ['Chocobo','Danifm','Daniju','El Jefe','Gunner','La Jefa',
  'Mario','Minato','Perickko','Pixelmaster','Toni','Wuantiles'];
const RATIO_IMG = 842/1264;
const EMOJIS_RESERVA = ['🐔','','🕵️','','','😎','','🌀','','','',''];

const PENALIZACION = 10;

const personajes = [];
let listos = 0;

function procesar(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height);
  const px = d.data;
  for(let i=0; i<px.length; i+=4){
    if(px[i]>235 && px[i+1]>235 && px[i+2]>235) px[i+3] = 0;
  }
  x.putImageData(d, 0, 0);
  return c;
}

for(let i=0; i<ARCHIVOS.length; i++){
  const p = { sprite:null, ratio:RATIO_IMG, nombre:NOMBRES[i] };
  personajes.push(p);
  const img = new Image();
  img.onload = () => {
    p.ratio = img.naturalWidth / img.naturalHeight;
    try { p.sprite = procesar(img); }
    catch(e){ p.sprite = img; }
    fin();
  };
  img.onerror = fin;
  img.src = ARCHIVOS[i];
}

function fin(){
  if(++listos === ARCHIVOS.length){
    cargado = true;
    const n = personajes.filter(p=>p.sprite).length;
    document.getElementById('estadoCarga').innerHTML =
      '🖼 Forajidos cargados: <b>'+n+'</b> de '+ARCHIVOS.length+
      (n<ARCHIVOS.length ? ' (los que faltan saldrán con emoji)' : '');
    const gal = document.getElementById('galeria');
    personajes.forEach((p,i)=>{
      if(p.sprite){
        const im = document.createElement('img');
        im.src = ARCHIVOS[i];
        im.title = p.nombre;
        gal.appendChild(im);
      } else {
        const s = document.createElement('span');
        s.textContent = '❓'; s.style.fontSize='40px'; s.title = p.nombre;
        gal.appendChild(s);
      }
    });
    if(esTouch){
      btnJugar.style.display = 'none';          // en móvil, el botón es el de pantalla completa
      btnPantalla.style.display = 'inline-block';
    } else {
      btnJugar.disabled = false; btnJugar.style.opacity = 1;
    }
  }
}

// ---------- 8 ZONAS (4 col x 2 filas) ----------
let zonas = [];
function calcularZonas(){
  zonas = [];
  const cw = W/4, ch = H/2;
  for(let f=0; f<2; f++) for(let c=0; c<4; c++){
    let dir;
    if(c===0) dir='izq'; else if(c===3) dir='der';
    else dir = (f===0) ? 'arriba' : 'abajo';
    zonas.push({ x:c*cw, y:f*ch, w:cw, h:ch, dir, cx:c*cw+cw/2, cy:f*ch+ch/2 });
  }
}

function nivelesY(){
  const z = zonas[0];
  const hPers = 1.6 * 0.5 * Math.min(z.w, z.h);
  return {
    yArriba: z.cy + hPers/2,
    yAbajo:  z.cy + z.h + hPers/2
  };
}

// ---------- ESTADO ----------
let activos = [], efectos = [], agujeros = [], matas = [];
let tiroteados = Array(ARCHIVOS.length).fill(0);
let dispararon = Array(ARCHIVOS.length).fill(0);
let score = 0, tiempo = 60, balas = 6, racha = 0;
let jugando = false, tPrevio = 0, spawnTimer = 0, flashBoca = 0;
let dano = 0, shake = 0, mataTimer = 3;
let raton = {x:innerWidth/2, y:innerHeight/2};

function multPorRacha(r){ return r>=12?5 : r>=9?4 : r>=6?3 : r>=3?2 : 1; }

// ---------- REVÓLVER ----------
function datosPistola(){
  const S = Math.max(0.8, Math.min(1.5, Math.min(W,H)/700));
  return { S, gx:W/2, gy:H + 15*S };
}
function bocaCanon(x,y){
  const {S,gx,gy} = datosPistola();
  const ang = Math.atan2(y-gy, x-gx);
  return { ang, bx:gx + Math.cos(ang)*80*S, by:gy + Math.sin(ang)*80*S };
}

// ---------- SONIDOS ----------
let audioCtx = null;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }

const RUTAS_SONIDO = {
  disparo:'disparo.ogg', disparo2:'disparo2.ogg', recarga:'recarga.ogg', ouch:'ouch.ogg',
  lajefa:'lajefa.ogg', perickko:'perickko.ogg', chocobo:'chocobo.ogg',
  disparoPixel:'disparo-pixelmaster.ogg'
};
const SONIDOS_ESPECIALES = {
  'lajefa.png':'lajefa',
  'perickko.png':'perickko',
  'chocobo.png':'chocobo'
};
const SONIDOS_DISPARO_ESPECIALES = {
  'pixelmaster.png':'disparoPixel'
};
for(const k in RUTAS_SONIDO){
  const a = new Audio(RUTAS_SONIDO[k]);
  a.preload = 'auto';
}
function reproducir(k, volumen=1, rate=1){
  const c = new Audio(RUTAS_SONIDO[k]);
  c.volume = volumen;
  c.playbackRate = rate;
  c.play().catch(()=>{});
}
function sonidoSeco(f){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='square'; o.frequency.value=f;
  g.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.08);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.09);
}

// ---------- SPAWN ----------
function aparecerPersonaje(){
  const usados = new Set(activos.map(a=>a.idx));
  const libres = personajes.map((p,i)=>i).filter(i=>!usados.has(i));
  if(!libres.length) return;
  const idx = libres[Math.floor(Math.random()*libres.length)];
  const zonasLibres = zonas.filter(z=>!activos.some(a=>a.zona===z));
  if(!zonasLibres.length) return;
  const zona = zonasLibres[Math.floor(Math.random()*zonasLibres.length)];
  const info = personajes[idx];

  const tam = Math.min(zona.w, zona.h)*0.5;
  const h = tam*1.6, w = h*info.ratio;
  let ix = zona.cx, iy = zona.cy;
  if(zona.dir==='izq')    ix = -w;
  if(zona.dir==='der')    ix = W + w;
  if(zona.dir==='arriba') iy = -h;
  if(zona.dir==='abajo')  iy = H + h;

  activos.push({ idx, zona, tam, w, h, sprite:info.sprite,
    x:ix, y:iy, sx:zona.cx, sy:zona.cy, ix, iy,
    fase:'entrando', progreso:0,
    tiempoVisible: 1.0 + Math.random()*1.2,
    tDisparo:0, disparado:false });
}

function easeOut(t){ return 1 - Math.pow(1-t, 3); }

// ---------- DISPARO ENEMIGO ----------
function disparoEnemigo(a){
  const {gx,gy} = datosPistola();
  efectos.push({tipo:'flashEnemigo', x:a.x, y:a.y, vida:0.15});
  efectos.push({tipo:'balaEnemiga', x0:a.x, y0:a.y, x1:gx, y1:gy-30, vida:0.12, total:0.12});
  reproducir(SONIDOS_DISPARO_ESPECIALES[ARCHIVOS[a.idx]] || 'disparo2');
  dispararon[a.idx]++;
  if(PENALIZACION > 0){
    score = Math.max(0, score - PENALIZACION);
    efectos.push({tipo:'acertado', x:gx, y:gy-80, vida:0.8, texto:'-'+PENALIZACION+' ¡te han dado!', color:'#ff6a5a'});
    dano = 1; shake = 1;
  }
}

function actualizar(dt){
  if(pausa) return;
  if(jugando){
    tiempo -= dt;
    if(tiempo<=0){ tiempo=0; jugando=false; }
    spawnTimer -= dt;
    if(spawnTimer<=0){ aparecerPersonaje(); spawnTimer = 0.5 + Math.random()*0.9; }
  }
  for(let i=activos.length-1; i>=0; i--){
    const a = activos[i];
    if(a.fase==='entrando'){ a.progreso += dt*1.2; if(a.progreso>=1){ a.progreso=1; a.fase='visible'; } }
    else if(a.fase==='visible'){
      a.tiempoVisible -= dt;
      if(a.tiempoVisible<=0){ a.fase='disparando'; a.tDisparo=0; a.disparado=false; }
    }
    else if(a.fase==='disparando'){
      a.tDisparo += dt;
      if(!a.disparado && a.tDisparo >= 0.15){ a.disparado = true; disparoEnemigo(a); }
      if(a.tDisparo >= 0.7){ a.fase='saliendo'; a.progreso=0; }
    }
    else { a.progreso += dt*1.2; if(a.progreso>=1){ activos.splice(i,1); continue; } }
    const e = easeOut(Math.min(a.progreso,1));
    if(a.fase==='saliendo'){ a.x = a.sx+(a.ix-a.sx)*e; a.y = a.sy+(a.iy-a.sy)*e; }
    else if(a.fase!=='disparando'){ a.x = a.ix+(a.sx-a.ix)*e; a.y = a.iy+(a.sy-a.iy)*e; }
  }
  mataTimer -= dt;
  if(mataTimer<=0){
    mataTimer = 4 + Math.random()*6;
    const dir = Math.random()<0.5?1:-1;
    const {yAbajo} = nivelesY();
    const r = 12+Math.random()*10;
    matas.push({ x: dir>0? -r : W+r, y: yAbajo+(H-yAbajo)*0.5,
      vx: dir*(120+Math.random()*120), rot:0, vrot: dir*(4+Math.random()*3), r });
  }
  for(let i=matas.length-1;i>=0;i--){
    const m=matas[i]; m.x+=m.vx*dt; m.rot+=m.vrot*dt;
    if(m.x<-80||m.x>W+80) matas.splice(i,1);
  }
  for(let i=agujeros.length-1;i>=0;i--){ agujeros[i].vida-=dt; if(agujeros[i].vida<=0) agujeros.splice(i,1); }
  for(let i=efectos.length-1;i>=0;i--){ efectos[i].vida-=dt; if(efectos[i].vida<=0) efectos.splice(i,1); }
  flashBoca = Math.max(0, flashBoca - dt*8);
  dano = Math.max(0, dano - dt*2);
  shake = Math.max(0, shake - dt*3);
}

// ---------- DISPARO DEL JUGADOR ----------
function disparar(x,y){
  if(!jugando) return;
  if(balas<=0){ sonidoSeco(200); return; }
  balas--; flashBoca = 1;
  reproducir('disparo');

  const {bx,by} = bocaCanon(x,y);
  efectos.push({tipo:'bala', x0:bx, y0:by, x1:x, y1:y, vida:0.09, total:0.09});

  for(let i=activos.length-1;i>=0;i--){
    const a = activos[i];
    if(a.fase==='saliendo') continue;
    let tocado;
    if(a.sprite) tocado = Math.abs(x-a.x) < a.w*0.5 && Math.abs(y-a.y) < a.h*0.5;
    else         tocado = Math.hypot(x-a.x, y-a.y) < a.tam*0.55;
    if(tocado){
      const headshot = y < a.y - a.h*0.25;
      racha++;
      const mult = multPorRacha(racha);
      const pts = (headshot?20:10) * mult;
      score += pts;
      tiroteados[a.idx]++;
      reproducir(SONIDOS_ESPECIALES[ARCHIVOS[a.idx]] || 'ouch');
      efectos.push({tipo:'acertado', x:a.x, y:a.y-a.h*0.4, vida:0.8,
        texto:(headshot?'¡HEADSHOT! ':'')+'+'+pts+(mult>1?' (x'+mult+')':''),
        color: headshot?'#ff9a4a':undefined});
      activos.splice(i,1);
      return;
    }
  }
  if(racha>=3) efectos.push({tipo:'texto', x, y:y+30, vida:0.7, texto:'💔 racha rota', color:'#bbb'});
  racha = 0;
  agujeros.push({x, y, vida:4});
  if(agujeros.length>40) agujeros.shift();
  efectos.push({tipo:'fallo', x, y, vida:0.4});
}
function recargar(){
  if(balas<6){ balas=6; reproducir('recarga');
    efectos.push({tipo:'texto', x:W/2, y:H-40, vida:0.8, texto:'¡Recargado!'}); }
}

// ---------- DIBUJO ----------
function dibujarFondo(){
  const {yArriba, yAbajo} = nivelesY();
  const wallTop = Math.max(40, yArriba - H*0.30);

  const g = ctx.createLinearGradient(0,0,0,wallTop);
  g.addColorStop(0,'#2c3e6b'); g.addColorStop(0.6,'#c85a2f'); g.addColorStop(1,'#e8a94f');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,wallTop);
  ctx.fillStyle='#ffd97a';
  ctx.beginPath(); ctx.arc(W*0.78, wallTop*0.5, H*0.05, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#5a3a2a';
  ctx.beginPath(); ctx.moveTo(0,wallTop);
  for(let x=0;x<=W;x+=W/8) ctx.lineTo(x, wallTop - Math.abs(Math.sin(x*0.01+2))*H*0.05 - H*0.01);
  ctx.lineTo(W,wallTop); ctx.fill();

  ctx.fillStyle='#5a3a24';
  ctx.fillRect(0, wallTop, W, yArriba-wallTop);
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=2;
  for(let x=40;x<W;x+=80){
    ctx.beginPath(); ctx.moveTo(x,wallTop); ctx.lineTo(x,yArriba); ctx.stroke();
  }
  ctx.fillStyle='#e8c96a';
  for(let i=0;i<4;i++){
    const wx = W*(0.12+0.25*i);
    ctx.fillRect(wx-W*0.02, wallTop+(yArriba-wallTop)*0.25, W*0.04, (yArriba-wallTop)*0.4);
  }

  ctx.fillStyle='#8a5a2b'; ctx.fillRect(0, yArriba, W, 10);
  ctx.fillStyle='#6b4a2a'; ctx.fillRect(0, yArriba+10, W, 8);

  ctx.fillStyle='#4a2f1d';
  ctx.fillRect(0, yArriba+18, W, Math.max(0, yAbajo-(yArriba+18)));
  const dw = W*0.07, dh = (yAbajo-yArriba)*0.55;
  ctx.fillStyle='#2b1a0f';
  ctx.fillRect(W/2-dw/2, yAbajo-dh, dw, dh);
  ctx.fillStyle='#e8c96a';
  ctx.fillRect(W/2-dw/2+dw*0.15, yAbajo-dh*0.85, dw*0.7, dh*0.25);
  ctx.fillStyle='#d9b98a';
  ctx.fillRect(W/2-W*0.06, yArriba+(yAbajo-yArriba)*0.16, W*0.12, 22);
  ctx.fillStyle='#5a3a24';
  ctx.font='bold '+Math.max(12,H*0.02)+'px Georgia';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('SALOON', W/2, yArriba+(yAbajo-yArriba)*0.16+11);
  ctx.fillStyle='#e8c96a';
  ctx.fillRect(W*0.2, yAbajo-dh*0.8, W*0.05, dh*0.5);
  ctx.fillRect(W*0.75, yAbajo-dh*0.8, W*0.05, dh*0.5);

  const gs = ctx.createLinearGradient(0,yAbajo,0,H);
  gs.addColorStop(0,'#c98b4b'); gs.addColorStop(1,'#8a5a2b');
  ctx.fillStyle=gs; ctx.fillRect(0,yAbajo,W,H-yAbajo);
  cactus(W*0.06, yAbajo+(H-yAbajo)*0.7, (H-yAbajo)*0.5);
  cactus(W*0.94, yAbajo+(H-yAbajo)*0.75, (H-yAbajo)*0.45);
}
function cactus(x,y,t){
  ctx.fillStyle='#2f6b3a';
  ctx.fillRect(x-t*0.12, y-t, t*0.24, t);
  ctx.fillRect(x-t*0.45, y-t*0.7, t*0.35, t*0.14);
  ctx.fillRect(x-t*0.45, y-t*0.7, t*0.14, t*0.35);
  ctx.fillRect(x+t*0.15, y-t*0.55, t*0.35, t*0.14);
  ctx.fillRect(x+t*0.35, y-t*0.55, t*0.14, t*0.3);
}

function dibujarAgujeros(){
  for(const a of agujeros){
    ctx.globalAlpha = Math.min(1, a.vida);
    ctx.fillStyle='#2b1a0f';
    ctx.beginPath(); ctx.arc(a.x,a.y,3.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(a.x,a.y,5.5,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function dibujarMatas(){
  for(const m of matas){
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.strokeStyle='rgba(120,90,40,0.9)';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,m.r,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,m.r*0.6,0.5,3.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,m.r*0.35,2,5.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-m.r*0.7,0); ctx.lineTo(m.r*0.7,0); ctx.stroke();
    ctx.restore();
  }
}

function dibujarPersonajes(){
  for(const a of activos){
    if(a.sprite){
      ctx.drawImage(a.sprite, a.x-a.w/2, a.y-a.h/2, a.w, a.h);
    } else {
      ctx.font = a.tam + 'px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(EMOJIS_RESERVA[a.idx], a.x, a.y);
    }
  }
}

function estrella(x,y,R){
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4;
    ctx.lineTo(x+Math.cos(a)*R, y+Math.sin(a)*R);
    const a2 = a + Math.PI/8;
    ctx.lineTo(x+Math.cos(a2)*R*0.4, y+Math.sin(a2)*R*0.4);
  }
  ctx.closePath();
}

function dibujarEfectos(){
  for(const e of efectos){
    if(e.tipo==='bala' || e.tipo==='balaEnemiga'){
      const t = 1 - e.vida/e.total;
      const px = e.x0+(e.x1-e.x0)*t, py = e.y0+(e.y1-e.y0)*t;
      const tt = Math.max(0, t-0.3);
      const tx = e.x0+(e.x1-e.x0)*tt, ty = e.y0+(e.y1-e.y0)*tt;
      ctx.strokeStyle = e.tipo==='bala' ? 'rgba(255,200,90,0.9)' : 'rgba(255,90,60,0.9)';
      ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(px,py); ctx.stroke();
      ctx.fillStyle = e.tipo==='bala' ? '#ffe9a0' : '#ffb0a0';
      ctx.beginPath(); ctx.arc(px,py,4,0,Math.PI*2); ctx.fill();
    } else if(e.tipo==='flashEnemigo'){
      const f = e.vida/0.15;
      ctx.fillStyle = 'rgba(255,180,80,'+f+')';
      estrella(e.x, e.y, 30*f+6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,220,'+f+')';
      ctx.beginPath(); ctx.arc(e.x,e.y,(30*f+6)*0.35,0,Math.PI*2); ctx.fill();
    } else if(e.tipo==='fallo'){
      ctx.globalAlpha = Math.min(1, e.vida*2);
      ctx.strokeStyle='#ccc'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(e.x,e.y,10+(0.4-e.vida)*30,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = Math.min(1, e.vida*2);
      ctx.fillStyle = e.color || (e.tipo==='acertado' ? '#ffd97a' : '#8aff8a');
      ctx.font='bold 22px Georgia'; ctx.textAlign='center';
      ctx.fillText(e.texto, e.x, e.y - (0.7-e.vida)*50);
      ctx.globalAlpha = 1;
    }
  }
}

function dibujarPistola(){
  const {S,gx,gy} = datosPistola();
  const ang = Math.atan2(raton.y-gy, raton.x-gx);
  ctx.save();
  ctx.translate(gx,gy);
  ctx.rotate(ang);
  ctx.save();
  ctx.rotate(0.55);
  ctx.fillStyle = '#5a3a22';
  ctx.fillRect(-10*S, 6*S, 20*S, 42*S);
  ctx.restore();
  ctx.fillStyle = '#2e2e36';
  ctx.fillRect(-6*S, -7*S, 84*S, 14*S);
  ctx.fillRect(16*S, -12*S, 26*S, 24*S);
  ctx.fillStyle = '#4a4a55';
  ctx.fillRect(42*S, -7*S, 36*S, 5*S);
  ctx.fillRect(74*S, -11*S, 4*S, 6*S);
  ctx.restore();

  if(flashBoca > 0.4){
    const f = (flashBoca-0.4)/0.6;
    const {bx,by} = bocaCanon(raton.x, raton.y);
    ctx.save();
    ctx.translate(bx,by); ctx.rotate(ang);
    const R = 26*f*S + 8;
    ctx.fillStyle = 'rgba(255,220,120,'+f+')';
    estrella(0,0,R);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,220,'+f+')';
    ctx.beginPath(); ctx.arc(0,0,R*0.35,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function dibujarHUD(){
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,36);
  ctx.fillStyle='#ffd97a'; ctx.font='bold 20px Georgia'; ctx.textBaseline='middle';
  ctx.textAlign='left';  ctx.fillText('⭐ Puntos: '+score, 15, 19);
  const mult = multPorRacha(racha);
  if(mult>1){ ctx.fillStyle='#ff9a4a'; ctx.fillText('🔥 x'+mult, 230, 19); }
  ctx.fillStyle='#ffd97a';
  ctx.textAlign='center';ctx.fillText('⏱ '+Math.ceil(tiempo)+'s', W/2, 19);
  ctx.textAlign='right';
  let m=''; for(let i=0;i<6;i++) m += i<balas ? '🔸' : '·';
  ctx.fillText(m, W-15, 19);
}
function dibujarMira(){
  const {x,y} = raton;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  const r = 18;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-r-8,y); ctx.lineTo(x-r+4,y); ctx.moveTo(x+r+8,y); ctx.lineTo(x+r-4,y);
  ctx.moveTo(x,y-r-8); ctx.lineTo(x,y-r+4); ctx.moveTo(x,y+r+8); ctx.lineTo(x,y+r-4);
  ctx.stroke();
}

function bucle(t){
  const dt = Math.min((t - tPrevio)/1000, 0.05);
  tPrevio = t;
  actualizar(dt);

  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*10*shake, (Math.random()-0.5)*10*shake);
  dibujarFondo();
  dibujarAgujeros();
  dibujarMatas();
  dibujarPersonajes();
  dibujarEfectos();
  dibujarPistola();
  ctx.restore();

  if(dano>0){ ctx.fillStyle='rgba(255,40,20,'+(0.28*dano)+')'; ctx.fillRect(0,0,W,H); }

  dibujarHUD();
  if(!esTouch) dibujarMira();
  if(!jugando && tiempo<=0){
    if(esTouch) btnRecarga.style.display = 'none';
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd97a'; ctx.textAlign='center';
    ctx.font='bold 42px Georgia'; ctx.fillText('🤠 ¡SE ACABÓ EL TIEMPO!', W/2, H/2-80);
    ctx.font='28px Georgia'; ctx.fillText('Puntuación final: '+score, W/2, H/2-35);
    const totalT = tiroteados.reduce((a,b)=>a+b,0);
    const totalD = dispararon.reduce((a,b)=>a+b,0);
    ctx.font='22px Georgia'; ctx.fillStyle='#e8c96a';
    if(totalT>0 || totalD>0){
      if(totalT>0){
        const iMaxT = tiroteados.indexOf(Math.max(...tiroteados));
        ctx.fillText('🎯 El más tiroteado: '+NOMBRES[iMaxT]+' ('+tiroteados[iMaxT]+' tiros)', W/2, H/2+5);
      }
      if(totalD>0){
        const iMaxD = dispararon.indexOf(Math.max(...dispararon));
        ctx.fillText('💥 El que más te disparó: '+NOMBRES[iMaxD]+' ('+dispararon[iMaxD]+')', W/2, H/2+40);
      }
    } else {
      ctx.fillText('Duelo sin incidentes 😅', W/2, H/2+15);
    }
    ctx.font='20px Georgia'; ctx.fillStyle='#fff';
    ctx.fillText('Toca para jugar otra vez', W/2, H/2+85);
  }
  requestAnimationFrame(bucle);
}

function empezar(){
  score=0; tiempo=60; balas=6; racha=0;
  activos=[]; efectos=[]; agujeros=[]; matas=[];
  tiroteados = Array(ARCHIVOS.length).fill(0);
  dispararon = Array(ARCHIVOS.length).fill(0);
  spawnTimer=0.3; mataTimer=3; jugando=true;
  if(esTouch) btnRecarga.style.display = 'flex';
}

function arrancar(){
  if(!cargado) return;
  document.getElementById('aviso').style.display='none';
  initAudio();
  if(esTouch) pedirPantallaCompleta();
  empezar();
}

canvas.addEventListener('mousemove', e=>{ raton.x=e.clientX; raton.y=e.clientY; });
canvas.addEventListener('mousedown', e=>{
  initAudio();
  if(!jugando && tiempo<=0){ empezar(); return; }
  disparar(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', e=>{
  e.preventDefault(); initAudio();
  const t=e.touches[0]; raton.x=t.clientX; raton.y=t.clientY;
  if(!jugando && tiempo<=0){ empezar(); return; }
  disparar(t.clientX, t.clientY);
}, {passive:false});
addEventListener('keydown', e=>{
  if(e.key==='r'||e.key==='R'||e.key===' '){ e.preventDefault(); recargar(); }
});
btnRecarga.addEventListener('touchstart', e=>{
  e.preventDefault(); e.stopPropagation();
  initAudio();
  if(jugando) recargar();
}, {passive:false});
btnRecarga.addEventListener('click', e=>{
  e.stopPropagation();
  if(jugando) recargar();
});

// botón de pantalla completa (móvil)
btnPantalla.addEventListener('click', e=>{ e.stopPropagation(); arrancar(); });
// botón clásico (PC)
btnJugar.addEventListener('click', arrancar);

resize();
actualizarOrientacion();
requestAnimationFrame(bucle);
})();
</script>
</body>
</html>
